button{font-family:inherit;cursor:pointer}

#best{font-size:14px;font-weight:700;opacity:.9}
#rank{font-size:15px;font-weight:800;color:var(--gold);border:2px solid var(--gold);padding:6px 12px}

 if(G.six>0){G.six-=dt;if(G.six<=0){G.six=0;popup('аура закончилась','#fff')}}
 for(const k of['bub','banner','sub','alert'])if(G[k]&&(G[k].life-=dt)<=0)G[k]=null;
 if((G.shT-=dt)<=0){if(G.bub)G.shT=2;else{G.shT=10+Math.random()*5;bubble(pick(SHN,'shn'))}}
 if((G.saidT-=dt)<=0){G.saidT=7+Math.random()*5;if(!G.sub)say(pick(DON,'don'))}
 if((G.phT-=dt)<=0){G.phT=3+Math.random()*3;popup(pick(PH,'ph'),rand(['#fff','#ffe600','#00f0ff','#ff7ac6']),W/2+(Math.random()-.5)*60,H*.36+Math.random()*H*.2,17)}
 if((G.chatT-=dt)<=0){G.chatT=.6+Math.random()*1.1;chat();G.viewers+=Math.round((Math.random()-.3)*40)}
 if((G.donT-=dt)<=0){G.donT=13+Math.random()*9;if(!G.alert)donate(pick(NICK,'dn',4),rand(DAMT),pick(DMSG,'dm'))}
 G.decoAcc+=dy;while(G.decoAcc>=70){G.decoAcc-=70;addDeco(-40)}
 for(const d of G.deco)d.y+=dy;G.deco=G.deco.filter(d=>d.y<H+80);
 if((G.spawnT-=dt)<=0){spawnRow();G.spawnT=(250-Math.min(95,G.t*1.3))/G.speed}
 for(const o of G.objs){o.y+=dy*(o.vy||1);
  if(!o.done&&Math.abs(o.x-G.px)<42&&Math.abs(o.y-G.py)<56){
   if(o.good){o.done=1;collect(o)}
   else if(G.six>0){o.done=1;G.money+=67;popup('СНЕСЁН +67$','#ffe600',o.x,o.y);beep(200,.1,'square',.06,600)}
   else if(G.inv<=0){o.done=1;hit(o);if(st!=='play')break}}}
 G.objs=G.objs.filter(o=>o.y<H+60&&!(o.done&&o.good))}

// ---------- Рисование: мир (пиксели) ----------
const SKY=[['#ff6fb5','#b03ad8','#3a0a5e'],['#06140d','#0e2a1a','#1b0f2e'],['#000','#12002a','#2a0845']];
function sky(s){return grads[s]||(grads[s]=(()=>{const g=lx.createLinearGradient(0,0,0,H);SKY[s].forEach((c,i)=>g.addColorStop(i/2,c));return g})())}
function drawWorld(){const s=G.stage,g=lx;g.fillStyle=sky(s);g.fillRect(0,0,W,H);
 if(s===0){g.fillStyle='rgba(255,255,255,.12)';for(let y=(G.off*2)%40;y<H;y+=40)g.fillRect(0,Math.round(y/2)*2,W,2);for(let x=0;x<W;x+=30)g.fillRect(x,0,2,H)}
 if(s>=1){g.fillStyle='#fff';for(const p of STARS){const y=(p.y+G.off*p.z*(s===2?4:1)+G.t*p.z*(s===2?60:8))%900;if(y<H){g.globalAlpha=s===2?p.z:p.z*.25;g.fillRect(Math.round(p.x/2)*2,Math.round(y/2)*2,2,2)}}g.globalAlpha=1}
 for(const d of G.deco){
  if(d.sp)spr(SP[d.sp],d.x,d.y);
  else if(d.k==='sw'){g.fillStyle='#2c7a5a';g.beginPath();g.ellipse(d.x,d.y,26,18,0,0,7);g.fill();g.fillStyle='#3f9f78';g.fillRect(d.x-14,d.y-4,8,2);spr(SP['🐊'],d.x,d.y)}
  else if(d.k==='cd'){g.fillStyle=d.up?'#22e06b':'#ff3b3b';g.fillRect(d.x-1,d.y-d.h/2-10,2,d.h+20);g.fillRect(d.x-8,d.y-d.h/2,16,d.h)}
  else if(d.k==='pl'){g.fillStyle=d.c;g.beginPath();g.arc(d.x,d.y,d.r,0,7);g.fill();g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.arc(d.x+3,d.y+3,d.r-2,0,7);g.fill()}}
 const rc=['#1e0e2c','#0a1614','rgba(40,0,80,.5)'][s],ec=['#00f0ff','#22e06b','#b388ff'][s];
 g.fillStyle=rc;g.fillRect(60,0,240,H);
 g.fillStyle='rgba(255,255,255,.04)';for(let y=G.off%20-20;y<H;y+=20)g.fillRect(70+((y*7)%200+200)%200,Math.round(y/2)*2,2,2);
 for(let y=G.off%40-40;y<H;y+=20){const on=Math.round((y-G.off%40)/20)%2===0;g.fillStyle=s===0?(on?'#ff2d95':'#fff'):s===1?(on?'#22e06b':'#ff3b3b'):(on?'#b388ff':'#2a0845');g.fillRect(56,Math.round(y/2)*2,6,20);g.fillRect(298,Math.round(y/2)*2,6,20)}
 g.fillStyle=ec;g.fillRect(62,0,2,H);g.fillRect(296,0,2,H);
 g.fillStyle=s===1?'#ff3b3b':'rgba(255,255,255,.7)';for(let y=G.off-60;y<H;y+=60){g.fillRect(138,Math.round(y/2)*2,4,30);g.fillRect(218,Math.round(y/2)*2,4,30)}
 if(G.speed>600){g.fillStyle='rgba(255,255,255,.25)';for(let i=0;i<6;i++){const x=70+((i*53+G.t*900)%220),y=(i*131+G.t*1400)%H;g.fillRect(Math.round(x/2)*2,Math.round(y/2)*2,2,40)}}
 if(G.moon&&G.moonY<H+250){const x=W/2,y=G.moonY;g.fillStyle='#d9d9e6';g.beginPath();g.arc(x,y,120,0,7);g.fill();g.fillStyle='#b4b4c8';
  [[-50,-40,18],[40,-10,24],[-30,40,12],[60,-60,10]].forEach(([a,b,r])=>{g.beginPath();g.arc(x+a,y+b,r,0,7);g.fill()});g.fillStyle='#6b4423';g.fillRect(x-4,y+60,8,50)}
 for(const o of G.objs)if(!o.done){const c=o.e==='🚓'?SP[(G.t*6|0)%2?'cop0':'cop1']:SP[o.e];spr(c,o.x+(o.good?0:Math.round(Math.sin(G.t*3+o.w)*2)*2),o.y+(o.good?Math.round(Math.sin(G.t*5+o.y*.05))*2:0))}
 if(!(G.inv>0&&((G.t*12)|0)%2)){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(G.px-20,G.py-34,44,84);
  if(G.stage===2||G.six>0){g.fillStyle=G.six>0?'#ffe600':'#ff8c00';const f=Math.round(Math.random()*3)*4;g.fillRect(G.px-14,G.py+42,8,10+f);g.fillRect(G.px+6,G.py+42,8,10+f)}
  spr(owned.gold?SP.gold:SP.car,G.px,G.py)}}

// ---------- Рисование: интерфейс стрима ----------
function drawCam(){const x=6,y=6,w=150,h=80;cx.save();
 cx.fillStyle='#1a0b2e';cx.fillRect(x,y,w,h);cx.fillStyle='#2a1145';cx.fillRect(x,y+h-24,w,24);
 for(let i=0;i<w;i+=6){cx.fillStyle=`hsl(${(i*4+G.t*120)%360},100%,60%)`;cx.fillRect(x+i,y+2,4,2)}
 cx.globalAlpha=.25;txt('$AURA67',x+w/2,y+20,16,'#ff2d95','center',0);cx.globalAlpha=1;
 cx.beginPath();cx.rect(x,y,w,h);cx.clip();
 const bob=Math.round(Math.sin(G.t*8)*(G.yell>0?2:.6)),yl=G.yell>0&&((G.t*8)|0)%2,sl=G.bub&&((G.t*7)|0)%2;
 cx.drawImage(yl?SP.don1:SP.don0,x+2+(G.hitT>0?Math.round(Math.random()*4-2):0),y+8+bob,68,68);
 cx.drawImage(sl?SP.shn1:SP.shn0,x+78,y+12-bob,64,64);cx.restore();
 cx.lineWidth=3;cx.strokeStyle=G.six>0||G.peak>0?`hsl(${G.t*600%360},100%,60%)`:G.hitT>0?'#ff2b2b':'#ff2d95';cx.strokeRect(x,y,w,h);
 cx.fillStyle='#e00';cx.fillRect(x+4,y+6,30,12);txt('LIVE',x+19,y+12,8,'#fff','center',0);
 txt('👁 '+G.viewers.toLocaleString('ru'),x+w-4,y+12,9,'#fff','right',3);
 txt('ДОНАТЫЧ',x+36,y+h+8,9,'#ff7ac6','center',3);txt('ШНУРОК',x+112,y+h+8,9,'#7dff9a','center',3);
 const by=y+h+16;cx.fillStyle=K;cx.fillRect(x,by,w,10);const p=G.peak>0?1:G.cringe/100;
 cx.fillStyle=G.peak>0?`hsl(${G.t*600%360},100%,55%)`:p>.7?'#ff3b3b':'#ffcc33';cx.fillRect(x+1,by+1,(w-2)*p,8);
 txt(G.peak>0?'ПИК КРИНЖА x2':'КРИНЖ '+Math.floor(G.cringe)+'%',x+w/2,by+5,8,'#fff','center',2);
 const cy=by+14;cx.fillStyle='rgba(0,0,0,.4)';cx.fillRect(x,cy,w,G.chat.length*12+4);cx.font='800 9px system-ui,-apple-system,Arial,sans-serif';cx.textAlign='left';cx.textBaseline='middle';
 G.chat.forEach((m,i)=>{const yy=cy+8+i*12;cx.fillStyle=m.c;const n=m.n+':';cx.fillText(n,x+4,yy,70);const nw=Math.min(70,cx.measureText(n).width);cx.fillStyle='#fff';cx.fillText(' '+m.t,x+4+nw,yy,w-10-nw)})}
function drawBubble(){const b=G.bub;if(!b)return;cx.font='800 14px system-ui,-apple-system,Arial,sans-serif';const w=Math.min(W-20,cx.measureText(b.t).width+20);
 let x=Math.max(10,Math.min(W-10-w,G.px+10-w/2)),y=G.py-108;cx.fillStyle='#fff';cx.fillRect(x,y,w,30);cx.lineWidth=2;cx.strokeStyle=K;cx.strokeRect(x,y,w,30);
 cx.beginPath();cx.moveTo(G.px+4,y+30);cx.lineTo(G.px+12,y+44);cx.lineTo(G.px+16,y+30);cx.closePath();cx.fill();
 cx.fillStyle=K;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(b.t,x+w/2,y+15,w-12);txt('ШНУРОК',x+10,y-7,9,'#7dff9a','left',3)}
function drawRadar(){const x=40,y=H-205,r=32;cx.save();cx.globalAlpha=.88;cx.beginPath();cx.arc(x,y,r,0,7);cx.fillStyle='#0d3b22';cx.fill();cx.lineWidth=3;cx.strokeStyle='#fff';cx.stroke();cx.clip();
 cx.strokeStyle='rgba(120,255,160,.35)';cx.lineWidth=1;cx.beginPath();cx.moveTo(x-r,y);cx.lineTo(x+r,y);cx.moveTo(x,y-r);cx.lineTo(x,y+r);cx.stroke();
 const a=G.t*3;cx.fillStyle='rgba(120,255,160,.25)';cx.beginPath();cx.moveTo(x,y);cx.arc(x,y,r,a,a+.7);cx.fill();
 for(const o of G.objs){const dx=(o.x-G.px)/6,dy=(o.y-G.py)/7;if(dx*dx+dy*dy<r*r){cx.fillStyle=o.good?'#ffe600':'#ff2b2b';cx.fillRect(x+dx-2,y+dy-2,4,4)}}
 cx.fillStyle='#fff';cx.beginPath();cx.moveTo(x,y-6);cx.lineTo(x+4,y+4);cx.lineTo(x-4,y+4);cx.fill();cx.restore()}
function drawHud(){txt('$'+String(G.money).padStart(8,'0'),W-8,24,24,'#3ee06b','right',5,190);
 for(let i=0;i<5;i++){const on=i<G.stars;txt('★',W-18-i*25,52,24,on?(G.hitT>0&&(G.t*16|0)%2?'#ff3b3b':'#fff'):'rgba(255,255,255,.18)','center',on?4:2)}
 txt(STAGES[G.stage],W-8,76,12,'#ff7ac6','right',3);txt(Math.floor(G.dist)+' м',W-8,93,15,'#fff','right',3);txt('🪙 '+G.c67+'/67',W-8,110,12,'#ffe600','right',3);
 drawCam();drawRadar();
 if(G.sub)txt(G.sub.t,W/2,H-118,13,'#ffe600','center',4,W-20);
 if(G.alert){const a=G.alert,y=210,al=Math.max(0,Math.min(1,a.life*2,(4.2-a.life)*4));cx.globalAlpha=al;
  cx.fillStyle='#1b0a2e';cx.fillRect(24,y-28,W-48,60);cx.lineWidth=3;cx.strokeStyle=`hsl(${G.t*400%360},100%,60%)`;cx.strokeRect(24,y-28,W-48,60);
  de('💸',48,y-4,26);txt(a.n+' задонатил '+a.a,W/2+14,y-12,14,'#ffcc33','center',3,W-110);txt('«'+a.m+'»',W/2+14,y+12,11,'#fff','center',3,W-110);cx.globalAlpha=1}
 if(G.banner){const b=G.banner,y=H*.42;cx.fillStyle='rgba(0,0,0,.6)';cx.fillRect(0,y-46,W,b.c?108:84);
  txt(b.a,W/2,y-18,26,'#ffd400','center',5);txt(b.b,W/2,y+16,22,'#ffd400','center',5);if(b.c)txt(b.c,W/2,y+46,14,'#fff','center',3)}}
function draw(){const sh=G.six>0?3:G.shake>0?G.shake*18:0,sx=sh?(Math.random()-.5)*sh:0,sy=sh?(Math.random()-.5)*sh:0;
 drawWorld();cx.save();cx.translate(sx,sy);cx.drawImage(LC,0,0,LW,LC.height,0,0,W,LC.height*2);
 for(const d of G.deco)if(d.k==='ns'){cx.save();cx.translate(d.x,d.y);cx.rotate(-Math.PI/2);cx.fillStyle='rgba(0,0,0,.6)';cx.fillRect(-34,-12,68,24);cx.lineWidth=2;cx.strokeStyle=d.c;cx.strokeRect(-34,-12,68,24);
  txt(d.t,0,1,12,(G.t*4|0)%7?d.c:'#fff','center',0,60);cx.restore()}
 if(G.moon&&G.moonY<H+250){const x=W/2,y=G.moonY;cx.fillStyle='#fff8dc';cx.fillRect(x-95,y+10,190,56);cx.lineWidth=3;cx.strokeStyle='#6b4423';cx.strokeRect(x-95,y+10,190,56);
  txt('ЛУНА ПРОДАНА.',x,y+24,15,'#c00','center',0,180);txt('Рагпулл.',x,y+39,12,'#222','center',0,180);txt('Спасибо за ликвидность',x,y+54,12,'#222','center',0,180)}
 drawBubble();
 for(const f of G.fx){cx.globalAlpha=Math.min(1,f.life*1.5);if(f.e)de(f.e,f.x,f.y,f.size);else txt(f.t,f.x,f.y,f.size,f.col,'center',4)}cx.globalAlpha=1;
 if(G.six>0){cx.fillStyle=`hsla(${G.t*720%360},100%,55%,.16)`;cx.fillRect(-10,-10,W+20,H+20);const z=70+Math.sin(G.t*20)*12;
  de('6️⃣',W/2-z*.55,H*.36,z);de('7️⃣',W/2+z*.55,H*.36,z);txt('SIX SEVEN · '+G.six.toFixed(1),W/2,H*.36+z*.8,18,'#ffe600')}
 if(G.peak>0){cx.fillStyle=`hsla(${G.t*300%360},100%,50%,.08)`;cx.fillRect(-10,-10,W+20,H+20)}
 cx.restore();drawHud()}

let lt=performance.now();
function loop(now){const dt=Math.min(.05,Math.max(0,(now-lt)/1000));lt=now;update(dt);draw();requestAnimationFrame(loop)}

// ---------- Ввод ----------
function mv(d){unlock();if(st!=='play')return;const n=Math.max(0,Math.min(2,G.lane+d));if(n!==G.lane){G.lane=n;beep(d<0?520:640,.04,'triangle',.04)}}
for(const[id,d]of[['L',-1],['R',1]]){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();b.classList.add('on');mv(d)});
 ['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>b.classList.remove('on')))}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();mv(e.clientX-r.left<r.width/2?-1:1)});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if(k==='arrowleft'||k==='a'||k==='ф'){e.preventDefault();if(!e.repeat)mv(-1)}
 else if(k==='arrowright'||k==='d'||k==='в'){e.preventDefault();if(!e.repeat)mv(1)}
 else if((k===' '||k==='enter')&&st==='story')nextSlide()
 else if((k===' '||k==='enter')&&st==='dead'&&!$('over').classList.contains('wait'))start()});
$('mute').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem('mute67',muted?'1':'0')}catch(_){}unlock()});
document.addEventListener('touchmove',e=>{if(!e.target.closest('#shop'))e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

// ---------- Сюжет ----------
function showSlide(){const sc=$('sCv').getContext('2d');sc.imageSmoothingEnabled=false;sc.clearRect(0,0,150,75);
 if(slide===0){sc.drawImage(SP.don1,8,4,68,68);sc.drawImage(SP.shn0,78,8,64,64)}
 else if(slide===1){['cop0','🐊','👵','🐻','🐒'].forEach((k,i)=>{const c=SP[k];sc.drawImage(c,4+i*29+Math.round((26-c.width)/2),24+Math.round((28-c.height)/2))});sc.fillStyle='#e11';sc.fillRect(10,64,130,3)}
 else{sc.fillStyle='#d9d9e6';sc.beginPath();sc.arc(118,22,18,0,7);sc.fill();sc.fillStyle='#b4b4c8';sc.fillRect(108,16,6,6);sc.fillRect(122,26,5,5);sc.drawImage(owned.gold?SP.gold:SP.car,40,18,24,42)}
 $('sTitle').firstChild.textContent=STORY[slide][0];$('sTxt').innerHTML=STORY[slide][1];
 $('dots').innerHTML=STORY.map((_,i)=>'<span class="'+(i===slide?'on':'')+'"></span>').join('')}

$('story').addEventListener('pointerdown',e=>{e.preventDefault();nextSlide()});
$('skip').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();start()});
$('again').addEventListener('click',start);
$('share').addEventListener('click',()=>{const url=SHARE_URL||location.href.split('#')[0],
 t='Я поднял $'+G.money.toLocaleString('ru')+' и проехал '+Math.floor(G.dist)+' м в Бабло-Сити 🏎️🌕 Рейтинг: «'+rankOf(G.money)+'». Побьёшь?',
 link='https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(t);
 try{if(inTG){tg.openTelegramLink(link);return}}catch(e){}
 if(navigator.share)navigator.share({text:t,url}).catch(()=>{});else window.open(link,'_blank')});

// ---------- Магазин (Telegram Stars через n8n) ----------
const SHOP=[{id:'revive',e:'❤️‍🔥',t:'Второй шанс',d:'Шнурок договаривается с налоговой. Продолжаешь заезд с 2★. Раз за заезд.',p:5},
 {id:'gold',e:'🏆',t:'Золотая ламба',d:'Навсегда. +20% бабла за каждую монету. Блестит так, что стыдно.',p:50},
 {id:'tip',e:'⛽',t:'Донат на бензин',d:'В следующем заезде Донатыч зачитает твоё имя на стриме под сирену.',p:67}];
function renderShop(){$('items').innerHTML=SHOP.map(s=>{const off=s.id==='revive'&&(st!=='dead'||G.revived)||s.id==='gold'&&owned.gold;

 else{owned.tips++;save('owned',JSON.stringify(owned));toast('Донат принят. Донатыч зачитает тебя в следующем заезде.')}
 hap('ok');tune([523,659,784,1047,1319],'triangle',.07)}
function buy(id){if(!inTG||!tg.openInvoice){toast('Покупки работают только внутри Telegram');return}
 if(!N8N_URL){toast('Касса Шнурка ещё не открыта. Скоро!');return}
 toast('Шнурок выписывает счёт…');
 fetch(N8N_URL,{method:'POST',body:new URLSearchParams({item:id,initData:tg.initData})})
  .then(r=>r.json()).then(j=>{if(!j||!j.link)throw 0;$('toast').style.display='none';tg.openInvoice(j.link,s=>{if(s==='paid')grant(id);else if(s==='failed')toast('Оплата не прошла')})})
  .catch(()=>toast('Касса недоступна, попробуй позже'))}
$('items').addEventListener('click',e=>{const it=e.target.closest('.it');if(!it||it.classList.contains('off'))return;buy(it.dataset.id)});
$('shopB').addEventListener('click',openShop);$('shopX').addEventListener('click',()=>$('shop').classList.remove('show'));
$('revive').addEventListener('click',()=>buy('revive'));

addEventListener('resize',fit);fit();showSlide();requestAnimationFrame(loop);
window.game={get G(){return G},get st(){return st},start,grant,openShop,spawn(e,l,y){G.objs.push({e,l,x:LX(l),y:y===undefined?G.py:y,good:GOOD[e]?1:0,vy:0,w:0})}};
