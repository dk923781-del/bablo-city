canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:var(--f);cursor:pointer;color:var(--ink)}

.it .e{font-size:26px}.it .t{font-weight:900;font-size:15px}.it .d{font-size:12px;opacity:.75;margin-top:2px}

.it .p.f{background:var(--paper)}.it .p.on{background:var(--m)}

#toast{position:absolute;left:50%;top:40%;transform:translateX(-50%);background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 14px;border-radius:10px;font-weight:800;font-size:14px;z-index:9;display:none;max-width:300px;text-align:center}

function fit(){const vw=innerWidth,vh=innerHeight;H=Math.round(Math.min(820,Math.max(560,W*vh/vw)));S=Math.min(vw/W,vh/H);
 wrap.style.width=W*S+'px';wrap.style.height=H*S+'px';DPR=Math.min(window.devicePixelRatio||1,2);
 cv.width=Math.round(W*S*DPR);cv.height=Math.round(H*S*DPR);cx.setTransform(S*DPR,0,0,S*DPR,0,0);cx.imageSmoothingEnabled=false;
 LC.width=LW;LC.height=Math.ceil(H/2);lx.setTransform(.5,0,0,.5,0,0);lx.imageSmoothingEnabled=false;EC={};grads={};if(G.py)G.py=H-175}
function emo(e,s){const k=e+s;let c=EC[k];if(!c){const r=S*DPR,z=s*1.4;c=document.createElement('canvas');c.width=c.height=Math.ceil(z*r);
 const g=c.getContext('2d');g.scale(r,r);g.font=s+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(e,z/2,z/2+s*.06);EC[k]=c}return c}
function de(e,x,y,s){const z=s*1.4;cx.imageSmoothingEnabled=true;cx.drawImage(emo(e,s),x-z/2,y-z/2,z,z);cx.imageSmoothingEnabled=false}
function spr(c,x,y){lx.drawImage(c,Math.round(x/2-c.width/2)*2,Math.round(y/2-c.height/2)*2,c.width*2,c.height*2)}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
const UF=(s,w)=>(w||800)+' '+s+'px system-ui,-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif';
// Плашка в стиле необрутализма: заливка, чёрная обводка, жёсткая тень
function plate(x,y,w,h,bg,r){cx.fillStyle=K;rr(x+3,y+3,w,h,r||8);cx.fill();cx.fillStyle=bg;rr(x,y,w,h,r||8);cx.fill();cx.lineWidth=2.5;cx.strokeStyle=K;cx.stroke()}

 if(G.moon&&G.moonY<H+250){const x=W/2,y=G.moonY;g.fillStyle='#e6e3f0';g.beginPath();g.arc(x,y,120,0,7);g.fill();g.fillStyle='#c4c0d8';
  [[-50,-40,18],[40,-10,24],[-30,40,12],[60,-60,10]].forEach(([a,b,r])=>{g.beginPath();g.arc(x+a,y+b,r,0,7);g.fill()});g.fillStyle='#6b4423';g.fillRect(x-4,y+60,8,50)}
 for(const o of G.objs)if(!o.done){const c=o.e==='🚓'?SP[(G.t*6|0)%2?'cop0':'cop1']:SP[o.e];spr(c,o.x+(o.good?0:Math.round(Math.sin(G.t*3+o.w)*2)*2),o.y)}
 if(!(G.inv>0&&((G.t*12)|0)%2)){g.fillStyle='rgba(0,0,0,.3)';g.fillRect(G.px-20,G.py-34,44,84);
  if(G.stage===2||G.six>0){g.fillStyle=G.six>0?'#ffe14d':'#ff8c00';const f=Math.round(Math.random()*3)*4;g.fillRect(G.px-14,G.py+42,8,10+f);g.fillRect(G.px+6,G.py+42,8,10+f)}
  if(G.shield>0){g.strokeStyle='rgba(78,205,196,.9)';g.lineWidth=4;g.strokeRect(G.px-28,G.py-46,56,92)}
  spr(SP[owned.skin]||SP.car,G.px,G.py)}}

// ---------- Рисование: интерфейс ----------
function drawBubble(){const b=G.bub;if(!b)return;cx.font=UF(14,800);const w=Math.min(W-20,cx.measureText(b.t).width+20);
 let x=Math.max(10,Math.min(W-10-w,G.px+10-w/2)),y=G.py-108;plate(x,y,w,30,'#fff',8);
 cx.fillStyle='#fff';cx.beginPath();cx.moveTo(G.px+4,y+29);cx.lineTo(G.px+12,y+42);cx.lineTo(G.px+18,y+29);cx.closePath();cx.fill();cx.lineWidth=2.5;cx.strokeStyle=K;cx.beginPath();cx.moveTo(G.px+4,y+30);cx.lineTo(G.px+12,y+42);cx.lineTo(G.px+18,y+30);cx.stroke();
 cx.fillStyle=K;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(b.t,x+w/2,y+15,w-12);
 cx.font=UF(10,900);cx.fillStyle='#fff';cx.textAlign='left';cx.fillText('шнурок',x+2,y-8)}
function drawCap(){const c=G.cap;if(!c)return;const a=Math.min(1,(2.2-c.life)*8,c.life*4),sc=.92+.08*Math.min(1,(2.2-c.life)*8);
 cx.save();cx.globalAlpha=a;cx.translate(W/2,H*.27);cx.scale(sc,sc);cx.font=UF(17,800);const w=Math.min(W-30,cx.measureText(c.t).width+26);
 plate(-w/2,-18,w,36,'#fff',9);cx.fillStyle=K;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(c.t,0,1,w-16);cx.restore()}
function drawHud(){
 cx.font=UF(20,900);const mt='$'+G.money.toLocaleString('ru'),mw=cx.measureText(mt).width+18;plate(W-10-mw,10,mw,32,'#4ecdc4',8);cx.fillStyle=K;cx.textAlign='right';cx.textBaseline='middle';cx.fillText(mt,W-19,27);
 const sw=5*17+14;plate(W-10-sw,50,sw,24,G.hitT>0&&(G.t*14|0)%2?'#ff4d4d':'#fff',7);cx.font=UF(15,900);cx.textAlign='center';
 for(let i=0;i<5;i++){cx.fillStyle=i<G.stars?K:'#cfcfd6';cx.fillText('★',W-10-sw+15+i*17,63)}
 chip(Math.floor(G.dist).toLocaleString('ru')+' м',10,10,'left','#fff',15);
 cx.font=UF(11,800);cx.fillStyle='#fff';cx.textAlign='left';cx.fillText(STAGES[G.stage].toLowerCase(),12,52);
 let y=62;chip('🪙 '+G.c67+'/67',10,y,'left','#ffe14d',12);y+=30;
 if(G.shield>0){chip('🛡 x'+G.shield,10,y,'left','#4ecdc4',12);y+=30}
 if(G.mag>0){chip('🧲 '+G.mag.toFixed(1),10,y,'left','#ff5fa2',12);y+=30}
 if(G.x2)chip('x2 бабло',10,y,'left','#c3a6ff',12);
 if(G.banner){const b=G.banner,w=280,h=b.c?92:70,y=H*.38;plate(W/2-w/2,y,w,h,'#ffe14d',12);cx.fillStyle=K;cx.textAlign='center';cx.textBaseline='middle';
  cx.font=UF(22,900);cx.fillText(b.a,W/2,y+24,w-20);cx.font=UF(15,800);cx.fillText(b.b,W/2,y+48,w-20);if(b.c){cx.font=UF(12,700);cx.fillText(b.c,W/2,y+70,w-20)}}
 drawCap()}
function draw(){const sh=G.six>0?1.5:G.shake>0?G.shake*14:0,sx=sh?(Math.random()-.5)*sh:0,sy=sh?(Math.random()-.5)*sh:0;
 drawWorld();cx.save();cx.translate(sx,sy);cx.drawImage(LC,0,0,LW,LC.height,0,0,W,LC.height*2);
 for(const d of G.deco)if(d.k==='ns'){cx.save();cx.translate(d.x,d.y);cx.rotate(-Math.PI/2);plate(-32,-11,64,22,d.c,5);cx.font=UF(11,900);cx.fillStyle=K;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(d.t,0,1,56);cx.restore()}
 if(G.moon&&G.moonY<H+250){const x=W/2,y=G.moonY;plate(x-95,y+10,190,56,'#fff',8);cx.fillStyle=K;cx.textAlign='center';cx.textBaseline='middle';
  cx.font=UF(15,900);cx.fillStyle='#d01f3c';cx.fillText('ЛУНА ПРОДАНА.',x,y+25);cx.fillStyle=K;cx.font=UF(12,700);cx.fillText('Рагпулл. Спасибо за ликвидность',x,y+46,176)}
 drawBubble();
 if(G.six>0){cx.save();cx.translate(W/2,H*.3);cx.rotate(-.06);plate(-70,-34,140,68,'#ffe14d',12);cx.fillStyle=K;cx.textAlign='center';cx.textBaseline='middle';cx.font=UF(46,900);cx.fillText('6 7',0,2);cx.restore();
  chip('SIX SEVEN · '+G.six.toFixed(1),W/2,H*.3+46,'center','#fff',12)}
 cx.restore();drawHud()}

let lt=performance.now();
function loop(now){const dt=Math.min(.05,Math.max(0,(now-lt)/1000));lt=now;update(dt);draw();requestAnimationFrame(loop)}

// ---------- Ввод ----------
function mv(d){unlock();if(st!=='play')return;const n=Math.max(0,Math.min(2,G.lane+d));if(n!==G.lane){G.lane=n;beep(d<0?520:640,.04,'triangle',.04)}}
for(const[id,d]of[['L',-1],['R',1]]){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();b.classList.add('on');mv(d)});
 ['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>b.classList.remove('on')))}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();mv(e.clientX-r.left<r.width/2?-1:1)});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if(k==='arrowleft'||k==='a'||k==='ф'){e.preventDefault();if(st==='story')go(-1);else if(!e.repeat)mv(-1)}
 else if(k==='arrowright'||k==='d'||k==='в'){e.preventDefault();if(st==='story')go(1);else if(!e.repeat)mv(1)}
 else if((k===' '||k==='enter')&&st==='story')start()
 else if((k===' '||k==='enter')&&st==='dead'&&!$('over').classList.contains('wait'))start()});
$('mute').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem('mute67',muted?'1':'0')}catch(_){}unlock()});
document.addEventListener('touchmove',e=>{if(!e.target.closest('#shop'))e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

// ---------- Старт в виде сторис ----------
function showSlide(){const s=STORY[slide],sc=$('sCv').getContext('2d'),av=$('sAva').getContext('2d');sc.imageSmoothingEnabled=false;av.imageSmoothingEnabled=false;
 sc.clearRect(0,0,150,75);av.clearRect(0,0,32,32);av.drawImage(SP[s.ava],-1,-1,34,34);
 if(slide===0){sc.drawImage(SP.don1,8,4,68,68);sc.drawImage(SP.shn0,78,8,64,64)}
 else if(slide===1){['cop0','🐊','👵','🐻','🐒'].forEach((k,i)=>{const c=SP[k];sc.drawImage(c,4+i*29+Math.round((26-c.width)/2),24+Math.round((28-c.height)/2))})}
 else{sc.fillStyle='#e6e3f0';sc.beginPath();sc.arc(118,22,18,0,7);sc.fill();sc.fillStyle='#c4c0d8';sc.fillRect(108,16,6,6);sc.fillRect(122,26,5,5);sc.drawImage(SP[owned.skin]||SP.car,40,18,24,42)}
 $('sWho').textContent=s.who;$('sWhen').textContent=s.when;
 $('sCap').innerHTML=s.cap.map(t=>'<span class="cap">'+t+'</span>').join('<br>');
 [...$('bars').children].forEach((b,i)=>{b.className=i<slide?'done':'';});
 const cur=$('bars').children[slide];void cur.offsetWidth;cur.className='run';
 clearTimeout(storyT);if(slide<STORY.length-1)storyT=setTimeout(()=>go(1),7000)}
function go(d){unlock();if(st!=='story')return;const n=slide+d;if(n<0)return;if(n>=STORY.length){start();return}slide=n;beep(700,.04,'triangle',.03);showSlide()}
$('story').addEventListener('pointerdown',e=>{if(e.target.closest('#go'))return;e.preventDefault();const r=$('story').getBoundingClientRect();go(e.clientX-r.left<r.width/3?-1:1)});
$('go').addEventListener('click',e=>{e.stopPropagation();start()});
$('again').addEventListener('click',start);
$('share').addEventListener('click',()=>{const url=SHARE_URL||location.href.split('#')[0],
 t='POV: я поднял $'+G.money.toLocaleString('ru')+' и проехал '+Math.floor(G.dist)+' м в Бабло-Сити 🏎️ Ранг: '+rankOf(G.money)+'. Могнёшь?',
 link='https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(t);
 try{if(inTG){tg.openTelegramLink(link);return}}catch(e){}
 if(navigator.share)navigator.share({text:t,url}).catch(()=>{});else window.open(link,'_blank')});

// ---------- Гараж: бесплатное за рекорд, платное за Telegram Stars (касса в n8n) ----------
const SKINS=[{id:'car',e:'🩷',t:'Розовая ламба',d:'Классика Бабло-Сити.',need:0},
 {id:'cyan',e:'🧊',t:'Мьюинг-ламба',d:'Бесплатно за рекорд 5 000$.',need:5000},
 {id:'chrome',e:'🕶️',t:'Чад-ламба',d:'Бесплатно за рекорд 20 000$.',need:20000},
 {id:'choco',e:'🍫',t:'Дубайская ламба',d:'Шоколад и фисташка. Навсегда.',p:30},
 {id:'alt',e:'🖤',t:'Альтушка-ламба',d:'Чёрная с розовым. Навсегда.',p:30},
 {id:'gold',e:'🏆',t:'Золотая ламба',d:'Навсегда. +20% бабла за каждую монету.',p:50}];
const BOOSTS=[{id:'revive',e:'❤️‍🔥',t:'Второй шанс',d:'Продолжаешь заезд с 2 звёздами. Раз за заезд.',p:5},
 {id:'shields',e:'🛡',t:'Щит-пак x5',d:'Пять заездов начинаются со щитом на 1 удар.',p:15},
 {id:'x2',e:'💸',t:'x2 бабло',d:'Двойные деньги на 5 заездов.',p:25},
 {id:'tip',e:'⛽',t:'Донат на бензин',d:'Донатыч скажет тебе спасибо по имени в следующем заезде.',p:67}];
const row=(s,btn,cls,off)=>'<div class="it'+(off?' off':'')+'" data-id="'+s.id+'"><div class="e">'+s.e+'</div><div><div class="t">'+s.t+'</div><div class="d">'+s.d+'</div></div><div class="p '+(cls||'')+'">'+btn+'</div></div>';
const hasSkin=s=>s.p?owned[s.id]:best>=s.need;
function renderShop(){let h='<h3>ЛАМБЫ</h3>';
 for(const s of SKINS){const on=owned.skin===s.id;h+=on?row(s,'надета','on'):hasSkin(s)?row(s,'надеть','f'):s.p?row(s,s.p+' ⭐'):row(s,'рекорд '+s.need.toLocaleString('ru')+'$','f',true)}
 h+='<h3>БУСТЫ</h3>';for(const s of BOOSTS){let btn=s.p+' ⭐';if(s.id==='shields'&&owned.shields)btn+=' · есть '+owned.shields;if(s.id==='x2'&&owned.x2)btn+=' · есть '+owned.x2;
  h+=row(s,btn,'',s.id==='revive'&&(st!=='dead'||G.revived))}
 $('items').innerHTML=h}
function openShop(){renderShop();$('shop').classList.add('show')}
function grant(id){if(id==='revive')revive();
 else if(SKINS.some(s=>s.id===id)){owned[id]=1;owned.skin=id;toast('Ламба твоя. Навсегда.')}
 else if(id==='shields'){owned.shields+=5;toast('Щит-пак: +5 заездов со щитом')}
 else if(id==='x2'){owned.x2+=5;toast('x2 бабло на 5 заездов')}
 else{owned.tips++;toast('Донат принят. Донатыч скажет спасибо в следующем заезде.')}
 saveOwned();if(id!=='revive')renderShop();hap('ok');tune([523,659,784,1047,1319],'triangle',.07)}
function buy(id){if(!inTG||!tg.openInvoice){toast('Покупки работают только внутри Telegram');return}
 if(!N8N_URL){toast('Касса Шнурка ещё не открыта');return}
 toast('Шнурок выписывает счёт…');
 fetch(N8N_URL,{method:'POST',body:new URLSearchParams({item:id,initData:tg.initData})})
  .then(r=>r.json()).then(j=>{if(!j||!j.link)throw 0;$('toast').style.display='none';tg.openInvoice(j.link,s=>{if(s==='paid')grant(id);else if(s==='failed')toast('Оплата не прошла')})})
  .catch(()=>toast('Касса недоступна, попробуй позже'))}
$('items').addEventListener('click',e=>{const it=e.target.closest('.it');if(!it||it.classList.contains('off'))return;const id=it.dataset.id,sk=SKINS.find(s=>s.id===id);
 if(sk&&hasSkin(sk)){owned.skin=id;saveOwned();renderShop();beep(880,.06,'triangle',.05);return}
 buy(id)});
$('shopB').addEventListener('click',openShop);$('shopX').addEventListener('click',()=>$('shop').classList.remove('show'));
$('revive').addEventListener('click',()=>buy('revive'));

addEventListener('resize',fit);fit();showSlide();requestAnimationFrame(loop);
window.game={get G(){return G},get st(){return st},get owned(){return owned},start,grant,openShop,spawn(e,l,y){G.objs.push({e,l,x:LX(l),y:y===undefined?G.py:y,good:GOOD[e]?1:0,vy:0,w:0})}};
</script>
